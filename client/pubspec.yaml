publish_to: "none"
version: 1.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_riverpod: ^2.6.1
