# 灰测 Release 工作流 — 构建三端产物并发布 GitHub 预发布版
#
# 触发方式:
#   1. 手动: Actions → "gray release" → Run workflow(可选填 tag,默认 gray-<run_number>)
#   2. 自动: 推送 v* 标签(正式发版)
#
# 产物:
#   - study-wiki-core.exe       后端 sidecar (PyInstaller onefile)
#   - client-windows.zip        Windows 客户端(解压即用)
#   - studywiki-client-debug.apk  Android 调试包(灰测安装)
#
# 灰测版一律发布为 prerelease(非正式),配合 docs/gray-test-checklist.md 使用。

name: gray release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签(留空则自动生成 gray-<run_number>)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-backend:
    name: build-backend (windows exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 下载内嵌嵌入模型(all-MiniLM-L6-v2)
        run: |
          python -m pip install huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('sentence-transformers/all-MiniLM-L6-v2', local_dir='vendor_model', allow_patterns=['*.json','*.txt','model.safetensors','modules/*','modules/**/*','tokenizer*'])"
      - name: Build study-wiki-core.exe
        # --collect-all chromadb: chromadb 有运行时数据文件,漏了会导致
        # 冻结后 import bobanana.app 直接失败(uvicorn 只报外层错误)。
        run: >
          pyinstaller --onefile --name study-wiki-core
          --collect-all chromadb
          --add-data "static;static" --add-data "api;api" --add-data "vendor_model;vendor_model"
          main.py
      - name: "冒烟运行后端(诊断: 捕获真实导入错误)"
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "backend-out.log"
          $err = Join-Path $env:RUNNER_TEMP "backend-err.log"
          $p = Start-Process -FilePath ".\dist\study-wiki-core.exe" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 30
          if (!$p.HasExited) {
            # 服务器存活 = 冒烟通过(健康服务本就不该退出)
            "SMOKE_OK: 后端 30s 存活, uvicorn 就绪"
            Stop-Process -Id $p.Id -Force
            "----- STDOUT -----"
            Get-Content $out -ErrorAction SilentlyContinue | Select-Object -Last 30
            "----- STDERR -----"
            Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 20
            exit 0
          }
          "----- STDOUT -----"
          Get-Content $out -ErrorAction SilentlyContinue | Select-Object -Last 40
          "----- STDERR -----"
          Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 60
          "SMOKE_FAIL exit=$($p.ExitCode)"
          exit 1
      - name: 上传后端冒烟诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-logs
          path: |
            ${{ runner.temp }}/backend-out.log
            ${{ runner.temp }}/backend-err.log
      - name: 代码签名(若配置了证书)
        if: env.CODE_SIGN_PFX_BASE64 != ''
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:CODE_SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\study-wiki-core.exe
      - uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: dist/study-wiki-core.exe

  build-client-windows:
    name: build-client-windows
    runs-on: windows-latest
    needs: [build-backend]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows
      - name: 内置后端 sidecar exe(客户端自动拉起)
        uses: actions/download-artifact@v4
        with:
          name: backend-exe
          path: client/build/windows/x64/runner/Release
      - name: Zip Windows 客户端(自包含:客户端 + study-wiki-core.exe)
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath client-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: client/client-windows.zip

  build-client-apk:
    name: build-client-apk
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: 重命名 APK
        shell: pwsh
        run: |
          Copy-Item build/app/outputs/flutter-apk/app-debug.apk studywiki-client-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: client/studywiki-client-debug.apk

  build-installer:
    name: build-installer (一键安装包)
    runs-on: windows-latest
    needs: [build-backend, build-client-windows]
    steps:
      - uses: actions/checkout@v4
      - name: 下载后端与客户端产物
        uses: actions/download-artifact@v4
        with:
          path: stage
      - name: 下载 VC++ 运行库
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "stage\vc_redist.x64.exe"
      - name: 组装安装目录
        shell: pwsh
        run: |
          Expand-Archive -Path stage/client-windows/client-windows.zip -DestinationPath stage/client
          New-Item -ItemType Directory -Force -Path stage/client | Out-Null
          Copy-Item stage/backend-exe/study-wiki-core.exe stage/study-wiki-core.exe
      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress
      - name: 生成安装脚本
        shell: pwsh
        run: |
          @'
          [Setup]
          AppName=StudyWiki-Agent
          AppVersion=0.9.0
          DefaultDirName={autopf}\StudyWiki-Agent
          DefaultGroupName=StudyWiki-Agent
          OutputDir=dist
          OutputBaseFilename=studywiki-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          WizardStyle=modern
          UninstallDisplayIcon={app}\client\studywiki_client.exe

          [Files]
          Source: "stage\client\*"; DestDir: "{app}\client"; Flags: recursesubdirs ignoreversion
          Source: "stage\study-wiki-core.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "stage\vc_redist.x64.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Icons]
          Name: "{autoprograms}\StudyWiki-Agent"; Filename: "{app}\client\studywiki_client.exe"
          Name: "{autodesktop}\StudyWiki-Agent"; Filename: "{app}\client\studywiki_client.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加任务:"

          [Run]
          Filename: "{tmp}\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; StatusMsg: "安装 VC++ 运行库..."; Flags: waituntilterminated
          Filename: "{app}\client\studywiki_client.exe"; Description: "立即启动 StudyWiki-Agent"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Encoding UTF8 installer.iss
      - name: 编译安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: 安装包代码签名(若配置了证书)
        if: env.CODE_SIGN_PFX_BASE64 != ''
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:CODE_SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\studywiki-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/studywiki-setup.exe

  publish:
    name: publish gray release
    needs: [build-backend, build-client-windows, build-client-apk, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 确定发布标签
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=gray-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 发布 GitHub Release(预发布)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "灰测版 ${{ steps.tag.outputs.name }}"
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/backend-exe/study-wiki-core.exe
            artifacts/client-windows/client-windows.zip
            artifacts/client-apk/studywiki-client-debug.apk
            artifacts/installer/studywiki-setup.exe
          body: |
            ## 灰测说明
            本版本为灰度测试版(pre-release),请按 `docs/gray-test-checklist.md` 执行测试并反馈。

            ### 安装(推荐)
            - Windows: 下载 **`studywiki-setup.exe`** 一键安装(前后端一起装好,桌面/开始菜单快捷方式,双击即用)
            - 免安装版: 解压 `client-windows.zip` 双击 `studywiki_client.exe`(自动拉起内置后端,托盘常驻)
            - Android: 安装 `studywiki-client-debug.apk`(允许未知来源)

            ### 已知注意事项
            - 首次启动需配置 DeepSeek API Key(灰屏引导;后端冷启动约 10-20s,界面会自动重试等待)
            - 安装包未签名,可能出现 SmartScreen 提示,选择"仍要运行"
            - 问题反馈: https://github.com/ProfYangShengXu/AI-wiki/issues
